[project]
name = "sim2data-sim"
version = "0.1.0"
description = "Sim2Data Isaac Lab runtime environment"
requires-python = ">=3.11,<3.12"
dependencies = [
  "sim2data-core>=0.1,<0.2",
  "sim2data-isaac>=0.1,<0.2",
  "isaaclab==0.47.2",
  "isaacsim[all,extscache]==5.1.0.0",
  "torch==2.7.0+cu128",
]

[tool.uv.sources]
sim2data-core = { path = "../../packages/sim2data_core", editable = true }
sim2data-isaac = { path = "../../packages/sim2data_isaac", editable = true }
isaaclab = { path = "../../third_party/IsaacLab/source/isaaclab", editable = true }
torch = { index = "pytorch-cu128" }

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
extra-build-dependencies = { isaaclab = ["toml"], flatdict = ["setuptools<81"] }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = false
